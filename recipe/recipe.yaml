schema_version: 1

context:
  version: "2.21.0"

package:
  name: tf-keras
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/t/tf-keras/tf_keras-${{ version }}.tar.gz
    sha256: f9af0f2546cd5532de0fae7a481f34a1ca2253737d4cd1000f6b713dc733f770
  - url: https://raw.githubusercontent.com/keras-team/tf-keras/master/LICENSE
    sha256: 58d1e17ffe5109a7ae296caafcadfdbe6a7d176f0bc4ab01e12a689b0499d8bd
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - tensorflow <2.22,>=2.21

tests:
  - python:
      imports:
        - tf_keras
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Deep learning for humans.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://keras.io/
  repository: https://github.com/keras-team/tf-keras

extra:
  recipe-maintainers:
    - conda-forge/keras
